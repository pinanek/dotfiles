[settings]
experimental = true

python.uv_venv_auto = "source"
idiomatic_version_file_enable_tools = ["python"]

dotfiles.root = "~/.dotfiles/home"
dotfiles.default_mode = "copy"

[env]
HELIX_RUNTIME = "{{ env.HOME }}/.local/src/helix/runtime"

[task_config]
includes = [
  "tasks/helix.toml",
  "tasks/themes.toml",
]

[tools]
# Language runtimes
node = "24"
deno = "2"
python = "3.14"
rust = { version = "latest", components = "rust-analyzer" }
zig = "0.16"

# Package managers / build tools
aube = "latest"
cargo-binstall = "latest"
just = "latest"
npm = "latest"
pnpm = "latest"
uv = "latest"

# Formatters / linters
dprint = "latest"
ruff = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
"npm:prettier" = "latest"

# Language servers
"cargo:https://github.com/helix-editor/helix" = {
  version = "latest",
  crate = "helix-term",
  locked = true,
  install_env = {
    CARGO_BUILD_RUSTFLAGS = "-C target-cpu=native",
    CARGO_PROFILE_RELEASE_LTO = "fat",
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1",
    CARGO_PROFILE_RELEASE_STRIP = "true",
    CARGO_PROFILE_RELEASE_OPT_LEVEL = "3",
  },
}

lua-language-server = "latest"
marksman = "latest"
ty = "latest"
zls = "0.16"

"cargo:just-lsp" = "latest"
"npm:@microsoft/compose-language-service" = "latest"
"npm:bash-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"

[bootstrap.repos]
"~/.local/src/helix" = {
  url = "https://github.com/helix-editor/helix.git",
  ref = "master"
}
"~/.local/src/catppina" = {
  url = "https://github.com/pinanek/catppina.git",
  ref = "main"
}

[bootstrap.packages]
"brew:asciinema" = "latest"
"brew:autossh" = "latest"
"brew:bat" = "latest"
"brew:btop" = "latest"
"brew:cbonsai" = "latest"
"brew:croc" = "latest"
"brew:eza" = "latest"
"brew:fastfetch" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:ffmpeg" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:lazydocker" = "latest"
"brew:lazygit" = "latest"
"brew:lazysql" = "latest"
"brew:miniserve" = "latest"
"brew:nmap" = "latest"
"brew:ouch" = "latest"
"brew:posting" = "latest"
"brew:ripgrep" = "latest"
"brew:rtk" = "latest"
"brew:scooter" = "latest"
"brew:tlrc" = "latest"
"brew:vivid" = "latest"
"brew:yazi" = "latest"
"brew:zsh" = "latest"

[dotfiles]
