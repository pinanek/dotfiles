[[language]]
name = "bash"
indent = { tab-width = 2, unit = "  " }
formatter = { command = "shfmt", args = ["-i", "2"] }

[[language]]
name = "css"
formatter = { command = "prettier", args = ["--parser", "css"] }

[[language]]
name = "json"
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "jsonc"
formatter = { command = "prettier", args = ["--parser", "jsonc"] }

[[language]]
name = "html"
formatter = { command = "prettier", args = ["--parser", "html"] }

[[language]]
name = "markdown"
comment-tokens = ["-", "+", "*", "- [ ]", ">"]
formatter = { command = "prettier", args = ["--parser", "markdown"] }

[[language]]
name = "toml"
roots = ["."]
language-servers = ["tombi"]
formatter = { command = "tombi", args = ["format", "-"] }

[[language]]
name = "yaml"
formatter = { command = "prettier", args = ["--parser", "yaml"] }

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
formatter = { command = "ruff", args = ["format", "-"] }

# LSP config stuff
# Python
[language-server.ty]
command = "ty"
args = ["server"]

[language-server.ruff]
command = "ruff"
args = ["server"]

# Toml
[language-server.tombi]
command = "tombi"
args = ["lsp"]
