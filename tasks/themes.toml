["themes:sync"]
description = "Copy Catppina themes into the dotfiles repository"
run = '''
set -eu

source_dir="$HOME/.local/src/catppina/dist"
target_dir="$HOME/.dotfiles/home"

copy_theme() {
  source="$source_dir/$1"
  target="$target_dir/$2"

  if [ ! -f "$source" ]; then
    printf 'themes:sync: missing source: %s\n' "$source" >&2
    exit 1
  fi

  mkdir -p "$(dirname "$target")"
  install -m 0644 "$source" "$target"
}

copy_theme bat/catppina_light.tmTheme .config/bat/themes/catppina_light.tmTheme
copy_theme bat/catppina_dark.tmTheme .config/bat/themes/catppina_dark.tmTheme

copy_theme btop/catppina_light.theme .config/btop/themes/catppina_light.theme
copy_theme btop/catppina_dark.theme .config/btop/themes/catppina_dark.theme

copy_theme delta/catppina_light.gitconfig .config/delta/catppina_light.gitconfig
copy_theme delta/catppina_dark.gitconfig .config/delta/catppina_dark.gitconfig

copy_theme fzf/catppina_light.sh .zshrc.d/50_tools/fzf_catppina_light.sh
copy_theme fzf/catppina_dark.sh .zshrc.d/50_tools/fzf_catppina_dark.sh

copy_theme ghostty/catppina_light.conf .config/ghostty/themes/catppina_light
copy_theme ghostty/catppina_dark.conf .config/ghostty/themes/catppina_dark

copy_theme helix/catppina_light.toml .config/helix/themes/catppina_light.toml
copy_theme helix/catppina_dark.toml .config/helix/themes/catppina_dark.toml

copy_theme lazygit/catppina_light.yml .config/lazygit/theme_light.yml
copy_theme lazygit/catppina_dark.yml .config/lazygit/theme.yml

copy_theme yazi/catppina_light.toml .config/yazi/theme_light.toml
copy_theme yazi/catppina_dark.toml .config/yazi/theme_dark.toml

# copy_theme zsh-syntax-highlighting/catppina_light.zsh .zshrc.d/40_ui/20_zsh_syntax_highlighting_light.zsh
copy_theme zsh-syntax-highlighting/catppina_dark.zsh .zshrc.d/40_ui/20_zsh_syntax_highlighting_dark.zsh

copy_theme zed/catppina_light.json .config/zed/themes/catppina_light.json
copy_theme zed/catppina_dark.json .config/zed/themes/catppina_dark.json
'''
